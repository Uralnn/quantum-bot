        function pOp(o) {

        function insertVal(val) {

        // ===== Функции =====

                    hist = t === 'burn' ? 'Пример: 45,150' : 'Пример: 38,32';
                    rst = true; tpl = false; up(); return;
                }
                var a = num(arr[0]), b = num(arr[1]);

                if (t === 'burn') {
                    cur = (a / b * 100).toFixed(2) + ' л/100км'; hist = 'Расход топлива:';

            if (t === 'avg' || t === 'std') {

    <div class="kicker">🚀 Итоги</div>
    <h2>Итоги и <span class="accent">развитие</span></h2>
    <div class="row">
        <div class="col">
            <h3>Что даёт калькулятор уже сейчас</h3>
            <ul class="list" style="font-size:17px">
                <li>⛽ Мгновенный расчёт расхода и пережога по путевому листу</li>
                <li>📊 Выявление проблемных машин через AVG и STD</li>
                <li>🧮 Расчёт норм, бюджетов и стоимости перерасхода</li>
                <li>📐 Уклоны, расстояния, разделение расхода по режимам</li>
                <li>🔒 Офлайн, без установки, данные не покидают компьютер</li>
            </ul>
            <div class="note big warn" style="margin-top:auto"><b>Quantum Terminal v4</b> — карманный инструмент контроля ГСМ в одном файле, который открывается за секунду.</div>
        </div>
        <div class="col">
            <h3>Возможные доработки транспортного блока</h3>
            <table class="sm">
                <tr><th>Идея</th><th>Польза</th></tr>
                <tr><td><b>NORM</b>: <code>норма,км,коэф</code> → литры</td><td>Убирает ручной расчёт нормы</td></tr>
                <tr><td><b>COST</b>: <code>литры,цена</code> → рубли</td><td>Сразу даёт стоимость пережога</td></tr>
                <tr><td>Цвет OVER по порогам регламента</td><td>Мгновенная визуальная оценка</td></tr>
                <tr><td>Экспорт журнала в CSV</td><td>Перенос в Excel и отчёты</td></tr>
                <tr><td>Журнал в <code>localStorage</code></td><td>Не теряется при закрытии вкладки</td></tr>
                <tr><td>л/100км ↔ км/л ↔ MPG</td><td>Иностранная техника и документация</td></tr>
            </table>
        </div>
    </div>
</section>

</div>
</div>

<div id="progress"></div>
<div id="ui">
    <button id="prev" title="Назад (←)">◀</button>
    <span id="counter">1 / 17</span>
    <button id="next" title="Вперёд (→)">▶</button>
    <button id="toc-btn" title="Содержание и поиск (/)">☰</button>
    <button id="fs" title="Полный экран (F)">⛶</button>
    <button id="pr" title="Печать / PDF (P)">🖨</button>
    <span id="hint">← → навигация · / поиск · F полный экран · P печать</span>
</div>

<script>
(function () {
    function $(id) { return document.getElementById(id); }
    var slides = [].slice.call(document.querySelectorAll('.slide'));
    var deck = $('deck'), vp = $('viewport'), counter = $('counter'), progress = $('progress'),
        q = $('q'), res = $('results'), modeBtn = $('mode');
    var cur = 0, total = slides.length, userMode = null, sel = -1, items = [], lock = false;
    var host = window.parent !== window ? window.parent : (window.opener || null);

    function norm(s) { return String(s).toLowerCase().replace(/ё/g, 'е').replace(/−/g, '-'); }
    function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

    // ===== Поисковый индекс =====
    var index = slides.map(function (s, k) {
        var title = s.getAttribute('data-title') || ('Слайд ' + (k + 1));
        var text = s.textContent.replace(/\s+/g, ' ').trim();
        return { k: k, title: title, nt: norm(title), ng: norm(s.getAttribute('data-tags') || ''), text: text, nx: norm(text) };
    });

    slides.forEach(function (s, k) {
        var f = document.createElement('div');
        f.className = 'footer';
        f.innerHTML = '<span>Quantum Terminal v4 · Контроль топлива для транспортных компаний</span><span>' + (k + 1) + ' / ' + total + '</span>';
        s.appendChild(f);
    });

    var topics = [
        ['⛽ FUEL', 4, 'fuel'], ['⛽ OVER', 5, 'over'], ['📄 Путевой лист', 6, 'путевой'], ['🧮 Нормы и бюджет', 7, 'норма'],
        ['📊 AVG / STD', 8, 'std'], ['📈 Отчёт по парку', 9, ''], ['🔲 MATRIX', 10, 'matrix'], ['📐 Уклон, sin, tan', 11, 'уклон'],
        ['🔢 n! / mod', 11, 'mod'], ['π CONST / PLOT', 12, 'plot'], ['❓ HELP', 12, 'help'], ['⌨️ Клавиши', 13, 'enter'],
        ['⚠️ Ограничения', 14, ''], ['📌 Шпаргалка', 15, '']
    ];

    function count(h, w) { var n = 0, i = 0; while ((i = h.indexOf(w, i)) !== -1) { n++; i += w.length; } return n; }

    function search(qs) {
        var words = norm(qs).split(/\s+/).filter(Boolean);
        if (!words.length) return null;
        var list = [];
        index.forEach(function (it) {
            var score = 0, ok = true;
            words.forEach(function (w) {
                var inT = it.nt.indexOf(w) !== -1, inG = it.ng.indexOf(w) !== -1, cnt = count(it.nx, w);
                if (!inT && !inG && !cnt) ok = false;
                score += (inT ? 20 : 0) + (inG ? 8 : 0) + Math.min(cnt, 10);
            });
            if (ok) list.push({ it: it, score: score });
        });
        list.sort(function (a, b) { return b.score - a.score || a.it.k - b.it.k; });
        return { words: words, list: list };
    }

    function rx(words) {
        return new RegExp('(' + words.map(function (w) {
            return w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&').replace(/е/g, '[её]');
        }).join('|') + ')', 'gi');
    }

    function hl(s, words) {
        var r = rx(words), out = '', last = 0, m;
        while ((m = r.exec(s))) {
            if (!m[0].length) { r.lastIndex++; continue; }
            out += esc(s.slice(last, m.index)) + '<mark>' + esc(m[0]) + '</mark>';
            last = m.index + m[0].length;
        }
        return out + esc(s.slice(last));
    }

    function snippet(it, words) {
        var i = -1;
        words.forEach(function (w) { var j = it.nx.indexOf(w); if (j !== -1 && (i === -1 || j < i)) i = j; });
        if (i === -1) return esc(it.text.slice(0, 110)) + '…';
        var a = Math.max(0, i - 45), b = Math.min(it.text.length, i + 80);
        return (a > 0 ? '…' : '') + hl(it.text.slice(a, b), words) + (b < it.text.length ? '…' : '');
    }

    function render() {
        var qs = q.value.trim(), html = '';
        items = [];
        if (!qs) {
            if (host) html += '<div class="r-tip">💡 Примеры со значком ▸ кликабельны: они подставятся в калькулятор</div>';
            html += '<div class="r-h">Быстрый переход</div><div class="chips">' +
                topics.map(function (t, i) { return '<button class="chip" data-c="' + i + '">' + esc(t[0]) + '</button>'; }).join('') + '</div>';
            html += '<div class="r-h">Содержание</div>';
            index.forEach(function (it) {
                items.push({ k: it.k, words: [] });
                html += '<div class="r-item" data-i="' + (items.length - 1) + '"><b>' + (it.k + 1) + '. ' + esc(it.title) + '</b></div>';
            });
        } else {
            var r = search(qs);
            if (!r.list.length) {
                html = '<div class="r-empty">Ничего не найдено по запросу «' + esc(qs) + '»<br><span>Попробуйте: топливо, пережог, матрица, уклон, клавиши</span></div>';
            } else {
                html = '<div class="r-h">Найдено слайдов: ' + r.list.length + '</div>';
                r.list.forEach(function (o) {
                    items.push({ k: o.it.k, words: r.words });
                    html += '<div class="r-item" data-i="' + (items.length - 1) + '"><b>' + (o.it.k + 1) + '. ' + hl(o.it.title, r.words) + '</b><small>' + snippet(o.it, r.words) + '</small></div>';
                });
            }
        }
        res.innerHTML = html;
        sel = (qs && items.length) ? 0 : -1;
        paintSel();
        res.classList.add('open');
    }

    function paintSel() {
        var els = res.querySelectorAll('.r-item');
        for (var i = 0; i < els.length; i++) els[i].classList.toggle('sel', i === sel);
        if (els[sel]) els[sel].scrollIntoView({ block: 'nearest' });
    }
    function closeRes() { res.classList.remove('open'); }
    function pick(i) { var it = items[i]; if (!it) return; closeRes(); q.blur(); go(it.k, it.words); }

    // ===== Подсветка на слайде =====
    function clearMarks() {
        [].slice.call(document.querySelectorAll('mark.hl')).forEach(function (m) {
            var p = m.parentNode; p.replaceChild(document.createTextNode(m.textContent), m); p.normalize();
        });
    }
    function markIn(el, words) {
        var r = rx(words), walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT, null), nodes = [], n;
        while ((n = walker.nextNode())) { if (!n.parentNode.closest('.footer')) nodes.push(n); }
        nodes.forEach(function (node) {
            var s = node.nodeValue, m, last = 0, found = false, frag = document.createDocumentFragment();
            r.lastIndex = 0;
            while ((m = r.exec(s))) {
                if (!m[0].length) { r.lastIndex++; continue; }
                found = true;
                frag.appendChild(document.createTextNode(s.slice(last, m.index)));
                var mk = document.createElement('mark'); mk.className = 'hl'; mk.textContent = m[0]; frag.appendChild(mk);
                last = m.index + m[0].length;
            }
            if (!found) return;
            frag.appendChild(document.createTextNode(s.slice(last)));
            node.parentNode.replaceChild(frag, node);
        });
    }
    function go(k, words) {
        clearMarks();
        if (words && words.length) markIn(slides[k], words);
        var m = (words && words.length) ? slides[k].querySelector('mark.hl') : null;
        var doc = isDoc();
        show(k, !!(m && doc));
        if (m && doc) { lock = true; m.scrollIntoView({ block: 'center', behavior: 'smooth' }); setTimeout(function () { lock = false; }, 700); }
    }

    // ===== Навигация и режимы =====
    function isDoc() { return userMode ? userMode === 'doc' : window.innerWidth < 1000; }

    function updUI() {
        counter.textContent = (cur + 1) + ' / ' + total;
        progress.style.width = ((cur + 1) / total * 100) + '%';
        slides.forEach(function (s, k) { s.classList.toggle('active', k === cur); });
        if (!host) { try { history.replaceState(null, '', '#' + (cur + 1)); } catch (e) {} }
    }

    function show(n, noScroll) {
        cur = Math.max(0, Math.min(total - 1, n));
        if (isDoc()) {
            updUI();
            if (!noScroll) { lock = true; slides[cur].scrollIntoView({ behavior: 'smooth', block: 'start' }); setTimeout(function () { lock = false; }, 700); }
            return;
        }
        slides.forEach(function (s, k) { s.classList.toggle('prev', k < cur); });
        updUI();
    }

    function fit() {
        if (isDoc()) { deck.style.transform = 'none'; return; }
        var s = Math.min(window.innerWidth / 1300, (window.innerHeight - 108) / 740);
        deck.style.transform = 'scale(' + s + ')';
    }

    function applyMode() {
        var d = isDoc();
        document.body.classList.toggle('doc', d);
        modeBtn.textContent = d ? '🖥 Слайды' : '📄 Лента';
        modeBtn.title = d ? 'Показать как слайды' : 'Показать лентой (удобно в узкой панели)';
        fit();
        if (d) {
            slides.forEach(function (s) { s.classList.remove('prev'); });
            updUI();
            lock = true; slides[cur].scrollIntoView({ block: 'start' }); setTimeout(function () { lock = false; }, 100);
        } else show(cur);
    }

    vp.addEventListener('scroll', function () {
        if (!isDoc() || lock) return;
        var top = vp.getBoundingClientRect().top + 90, k = 0;
        slides.forEach(function (s, i) { if (s.getBoundingClientRect().top <= top) k = i; });
        if (k !== cur) { cur = k; updUI(); }
    });

    function fullscreen() {
        if (!document.fullscreenElement) { if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(function () {}); }
        else if (document.exitFullscreen) document.exitFullscreen();
    }

    $('prev').onclick = function () { show(cur - 1); };
    $('next').onclick = function () { show(cur + 1); };
    $('toc-btn').onclick = function () { q.focus(); };
    $('fs').onclick = fullscreen;
    $('pr').onclick = function () { window.print(); };
    modeBtn.onclick = function () { userMode = isDoc() ? 'deck' : 'doc'; applyMode(); };

    // ===== События поиска =====
    q.addEventListener('input', function () { if (!q.value.trim()) clearMarks(); render(); });
    q.addEventListener('focus', render);
    q.addEventListener('blur', function () { setTimeout(closeRes, 150); });
    q.addEventListener('keydown', function (e) {
        if (e.key === 'ArrowDown') { e.preventDefault(); if (!res.classList.contains('open')) render(); sel = Math.min(items.length - 1, sel + 1); paintSel(); }
        else if (e.key === 'ArrowUp') { e.preventDefault(); sel = Math.max(0, sel - 1); paintSel(); }
        else if (e.key === 'Enter') { e.preventDefault(); pick(sel < 0 ? 0 : sel); }
        else if (e.key === 'Escape') { e.preventDefault(); if (q.value) { q.value = ''; clearMarks(); render(); } else { closeRes(); q.blur(); } }
    });
    res.addEventListener('mousedown', function (e) {
        var c = e.target.closest('.chip');
        if (c) { e.preventDefault(); var t = topics[+c.getAttribute('data-c')]; closeRes(); q.blur(); go(t[1], t[2] ? [norm(t[2])] : []); return; }
        var it = e.target.closest('.r-item');
        if (it) { e.preventDefault(); pick(+it.getAttribute('data-i')); }
    });

    // ===== Клавиатура =====
    document.addEventListener('keydown', function (e) {
        if (e.target === q) return;
        var k = e.key;
        if (k === '/' || ((e.ctrlKey || e.metaKey) && /^[fFkKаАлЛ]$/.test(k))) { e.preventDefault(); q.focus(); q.select(); return; }
        if (e.ctrlKey || e.metaKey || e.altKey) return;
        if (k === 'Escape') {
            if (document.querySelector('mark.hl')) { clearMarks(); return; }
            if (host) host.postMessage({ type: 'quantum-help-close' }, '*');
            return;
        }
        if (k === 'f' || k === 'F' || k === 'а' || k === 'А') { fullscreen(); return; }
        if (k === 'p' || k === 'P' || k === 'з' || k === 'З') { e.preventDefault(); window.print(); return; }
        if (isDoc()) {
            if (k === 'ArrowRight') { show(cur + 1); e.preventDefault(); }
            else if (k === 'ArrowLeft') { show(cur - 1); e.preventDefault(); }
            else if (k === 'Home') { show(0); e.preventDefault(); }
            else if (k === 'End') { show(total - 1); e.preventDefault(); }
            return;
        }
        if (k === 'ArrowRight' || k === 'PageDown' || k === ' ' || k === 'Enter') { show(cur + 1); e.preventDefault(); }
        else if (k === 'ArrowLeft' || k === 'PageUp' || k === 'Backspace') { show(cur - 1); e.preventDefault(); }
        else if (k === 'Home') show(0);
        else if (k === 'End') show(total - 1);
    });

    var tx = null;
    document.addEventListener('touchstart', function (e) { tx = e.touches[0].clientX; }, { passive: true });
    document.addEventListener('touchend', function (e) {
        if (tx === null || isDoc()) { tx = null; return; }
        var dx = e.changedTouches[0].clientX - tx;
        if (Math.abs(dx) > 50) show(cur + (dx < 0 ? 1 : -1));
        tx = null;
    });

    // ===== Связь с калькулятором =====
    if (host) {
        [].forEach.call(document.querySelectorAll('.slide code'), function (c) {
            var v = c.textContent.trim();
            if (!/^[\d+\-*\/%().,;]+$/.test(v) || !/\d/.test(v)) return;
            c.classList.add('try');
            c.title = 'Клик — подставить в калькулятор';
            c.addEventListener('click', function (ev) {
                ev.stopPropagation();
                try { host.postMessage({ type: 'quantum-insert', value: v }, '*'); } catch (err) {}
                c.classList.add('sent');
                setTimeout(function () { c.classList.remove('sent'); }, 600);
            });
        });
    }
    window.addEventListener('message', function (e) {
        var d = e.data;
        if (!d || d.type !== 'quantum-help-search' || (host && e.source !== host)) return;
        q.value = d.q || '';
        var r = search(q.value);
        if (r && r.list.length) go(r.list[0].it.k, r.words);
    });

    window.addEventListener('resize', function () {
        if (isDoc() !== document.body.classList.contains('doc')) applyMode(); else fit();
    });

    var start = host ? NaN : parseInt((location.hash || '').replace('#', ''), 10);
    cur = isNaN(start) ? 0 : Math.max(0, Math.min(total - 1, start - 1));
    applyMode();
})();
<\/script>

</script>
